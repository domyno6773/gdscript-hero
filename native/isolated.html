<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scena Godot</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202b37;color:#fff}canvas{display:block;width:100%;height:100%;outline:none}#boot-status{position:absolute;top:8px;left:12px;font:14px sans-serif}</style>
</head>
<body>
<p id="boot-status" role="status">Caricamento del motore Godot…</p>
<canvas id="canvas" tabindex="0" aria-label="Scena Godot in esecuzione"></canvas>
<script>
function reportBootFailure(file) {
  const message = 'Impossibile caricare ' + file + '. Controlla la connessione e riprova.';
  document.getElementById('boot-status').textContent = message;
  const url = new URL(location.href);
  parent.postMessage({v:1,session:url.searchParams.get('session'),type:'error',message},url.origin);
}
</script>
<script src="godot.js" onerror="reportBootFailure('godot.js')"></script>
<script src="isolated-runner.js" onerror="reportBootFailure('isolated-runner.js')"></script>
</body>
</html>
