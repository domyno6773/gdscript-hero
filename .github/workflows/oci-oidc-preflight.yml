name: "OCI bridge - audit and guarded staging host"
on:
  workflow_dispatch:
    inputs:
      oracle_audit:
        description: "Run partial read-only Oracle inventory (requires protected environment setup)"
        required: true
        default: false
        type: boolean
      host_action:
        description: "Staging host: none, plan (read-only), create (requires initial Cloud Shell authorization)"
        required: true
        default: none
        type: choice
        options: [none, plan, create]
      free_tier_account:
        description: "I confirm the Oracle account is still Free Tier, with no paid upgrade"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
concurrency:
  group: oci-oidc-identity-check
  cancel-in-progress: false
jobs:
  identity-only:
    name: "GitHub identity; optional audit or guarded staging host"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: oci-readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm Python probe is syntactically valid
        run: python3 -m py_compile scripts/oci_github_oidc_probe.py
      - name: Inspect signed GitHub identity (no tokens printed)
        run: python3 scripts/oci_github_oidc_probe.py
      - name: Install Oracle SDK for optional Oracle operations
        if: ${{ inputs.oracle_audit || inputs.host_action != 'none' }}
        run: python3 -m pip install --disable-pip-version-check 'oci==2.189.0'
      - name: Exchange GitHub identity and read partial OCI inventory
        if: ${{ inputs.oracle_audit }}
        env:
          OCI_FED_DOMAIN_URL: ${{ secrets.OCI_FED_DOMAIN_URL }}
          OCI_FED_CLIENT_ID: ${{ secrets.OCI_FED_CLIENT_ID }}
          OCI_FED_CLIENT_SECRET: ${{ secrets.OCI_FED_CLIENT_SECRET }}
          OCI_FED_TENANCY: ${{ secrets.OCI_FED_TENANCY }}
          OCI_FED_REGION: ${{ secrets.OCI_FED_REGION }}
          OCI_FED_DOMAIN_OCID: ${{ secrets.OCI_FED_DOMAIN_OCID }}
        run: python3 scripts/oci_federated_readonly.py
      - name: Plan or create the fixed Always Free staging host
        if: ${{ inputs.host_action != 'none' }}
        env:
          OCI_FED_DOMAIN_URL: ${{ secrets.OCI_FED_DOMAIN_URL }}
          OCI_FED_CLIENT_ID: ${{ secrets.OCI_FED_CLIENT_ID }}
          OCI_FED_CLIENT_SECRET: ${{ secrets.OCI_FED_CLIENT_SECRET }}
          OCI_FED_TENANCY: ${{ secrets.OCI_FED_TENANCY }}
          OCI_FED_REGION: ${{ secrets.OCI_FED_REGION }}
          OCI_FED_DOMAIN_OCID: ${{ secrets.OCI_FED_DOMAIN_OCID }}
          GDH_HOST_ACTION: ${{ inputs.host_action }}
          GDH_FREE_TIER_ACCOUNT: ${{ inputs.free_tier_account }}
        run: python3 scripts/oci_cloudshell_bootstrap.py --github
