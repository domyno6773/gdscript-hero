name: GDScript Hero - Godot Native Runtime Spike

on:
  push:
    branches: [spike/godot-native-proof-20261026]

permissions:
  contents: read

jobs:
  godot-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.4.1 stable
        run: |
          curl --fail --location --retry 3 --silent --show-error https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot4.zip
          mkdir -p /tmp/godot4
          unzip -q /tmp/godot4.zip -d /tmp/godot4
          chmod +x /tmp/godot4/Godot_v4.4.1-stable_linux.x86_64
      - name: Probe native GDScript runtime
        env:
          GODOT: /tmp/godot4/Godot_v4.4.1-stable_linux.x86_64
        run: bash spikes/godot-web/tests/test_native.sh
