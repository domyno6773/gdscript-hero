name: GDScript Hero - Godot Web WASM Feasibility

on:
  push:
    branches: [spike/godot-native-proof-20261026]
    paths:
      - 'spikes/godot-web/**'
      - 'index.html'
      - 'lessons.js'
      - 'app.js'
      - '.github/workflows/godot-web-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure native fixtures match all 60 real course lessons
        run: node spikes/godot-web/tests/fixture_parity.cjs
      - name: Install Playwright (Chrome provided by GitHub runner)
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Download official Godot 4.4.1 and export templates
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 5 -o /tmp/godot-linux.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot-linux.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          curl -fL -C - --retry 5 --retry-all-errors --retry-delay 8 -o /tmp/godot-templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -p /tmp/godot-templates.tpz templates/web_nothreads_release.zip > /tmp/web_nothreads_release.zip
          test -s /tmp/web_nothreads_release.zip
          unzip -l /tmp/web_nothreads_release.zip | tail -15
          du -h /tmp/web_nothreads_release.zip
      - name: Import project and export Godot Web
        run: |
          set -euxo pipefail
          cd spikes/godot-web/project
          sed -i 's|custom_template/release=""|custom_template/release="/tmp/web_nothreads_release.zip"|' export_presets.cfg
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Web ../web/godot.html
          ls -lh ../web/godot*
          test -s ../web/godot.wasm
          test -s ../web/godot.js
          test -s ../web/godot.pck
          du -sh ../web
      - name: Run browser E2E on real Godot WASM (headless Chrome desktop + mobile emulation)
        run: node spikes/godot-web/tests/web_smoke.cjs
      - name: Cross-origin Godot runner proof (no user data)
        run: timeout 110s node spikes/godot-web/tests/isolation_smoke.cjs
      - name: Experimental infinite-loop recovery (not a release gate)
        continue-on-error: true
        run: timeout 75s node spikes/godot-web/tests/hang_smoke.cjs
      - name: Validate real lessons 1-12 and reject false positives using Godot WASM
        run: timeout 110s node spikes/godot-web/tests/native_lessons_1_12.cjs
      - name: Validate native lessons 13-24 including branching and arrays
        run: timeout 130s node spikes/godot-web/tests/native_lessons_13_24.cjs
      - name: Validate Godot native lessons 25-36 including loops, functions and Vector2
        run: timeout 140s node spikes/godot-web/tests/native_lessons_25_36.cjs
      - name: Validate native Godot dictionaries, signals, classes for lessons 37-48
        run: timeout 150s node spikes/godot-web/tests/native_lessons_37_48.cjs
      - name: Validate native scene lessons 49-60 including buttons, timer and shop
        run: timeout 160s node spikes/godot-web/tests/native_lessons_49_60.cjs
      - name: Capture advisory release-readiness, payload and startup measurements
        run: timeout 150s node spikes/godot-web/tests/release_readiness.cjs
      - name: Real editor integration E2E (offline auth, no XP or progress mutation)
        run: timeout 145s node spikes/godot-web/tests/main_editor_adapter.cjs
      - name: Upload screenshots + browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-wasm-spike-evidence
          path: spikes/godot-web/test-artifacts/
          retention-days: 7
          if-no-files-found: ignore
