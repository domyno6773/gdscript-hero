name: Phase 3 - build Godot browser pack

on:
  push:
    branches: [fix/phase3-native-lesson-visuals]
    paths:
      - 'native/project/runner.gd'
      - '.github/workflows/phase3-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Godot 4.4.1 engine
        run: |
          curl --fail --location --retry 3 --silent --show-error https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot4.zip
          unzip -q /tmp/godot4.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Compile project pack without altering the production site
        run: |
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path native/project --quit
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path native/project --export-pack "Web" "$PWD/native/godot-phase3.pck"
          test -s native/godot-phase3.pck
          echo "PACK_SIZE=$(wc -c < native/godot-phase3.pck)"
      - name: Emit pack in recoverable text chunks for review and installation
        run: |
          echo 'PHASE3_PACK_BASE64_BEGIN'
          base64 -w0 native/godot-phase3.pck | fold -w 120
          echo 'PHASE3_PACK_BASE64_END'
