name: GDScript Hero - Browser Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright without touching project dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check system Chrome
        run: google-chrome --version
      - name: Test guest mode in Chrome desktop/mobile
        run: node tests/browser_smoke.test.cjs
