name: GDScript Hero - Browser Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright without touching project dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check system Chrome
        run: google-chrome --version
      - name: Test guest mode in Chrome desktop/mobile
        run: E2E_SCREENSHOTS=1 node tests/browser_smoke.test.cjs
      - name: Install WebKit and Linux libraries for Safari compatibility
        run: npx playwright install --with-deps webkit
      - name: Test MacBook navigation in Chromium and Safari/WebKit
        run: E2E_SCREENSHOTS=1 node tests/navbar_macbook.test.cjs
      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exercise-ui-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
