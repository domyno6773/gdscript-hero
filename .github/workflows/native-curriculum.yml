name: GDScript Hero - Complete Native Curriculum

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (test-only dependency)
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check Chrome
        run: google-chrome --version
      - name: Exercise every official lesson and representative alternatives in real Godot WASM
        run: node tests/native_curriculum.test.cjs
