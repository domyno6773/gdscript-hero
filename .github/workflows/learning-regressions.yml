name: GDScript Hero - Regression Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Learning validators and 29 negative examples
        run: node tests/audit_validator_regression.test.cjs
      - name: Instructions and progressive hints match lesson objectives
        run: node tests/lesson_content_alignment.test.cjs
      - name: Extended curriculum structure and native verification contracts
        run: node tests/curriculum_expansion.test.cjs
      - name: Offline soundscape, independent music/SFX settings and mobile gesture
        run: node tests/audio_soundscape.test.cjs
      - name: Lesson 4 comments ignored and real output evaluated
        run: node tests/lesson4_comments_output.test.cjs
      - name: Chapter 1 multi-task lesson structure and persistence
        run: node tests/lesson_practice.test.cjs
      - name: Streak and accurate multi-task completion telemetry
        run: node tests/activity_tracking.test.cjs
      - name: Godot debug messages and reliable line numbers
        run: node tests/error_guide.test.cjs
      - name: Code comprehension throughout the course
        run: node tests/code_guide.test.cjs
      - name: Backups and cloud sync
        run: node tests/auth_reliability.test.cjs
      - name: Concurrent cloud revisions across two devices
        run: node tests/cloud_cas_concurrency.test.cjs
      - name: Account separation and real authentication
        run: node tests/account_isolation.test.cjs
      - name: XP 2.0, weekly limits and quest claims
        run: node tests/progression_v2.test.cjs
      - name: Arena and official leaderboard schema invariants
        run: node tests/competition_schema.test.cjs
      - name: Godot Arena demo scoring and no fraudulent XP
        run: node tests/competition_arena.test.cjs
      - name: Private Arena coordinator tests
        run: node --test server/arena/tests/*.test.cjs
      - name: Official Arena client contracts
        run: node tests/arena_official.test.cjs
