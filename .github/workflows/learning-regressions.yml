name: GDScript Hero - Regression Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Learning validators and 29 negative examples
        run: node tests/audit_validator_regression.test.cjs
      - name: Lesson 4 comments ignored and real output evaluated
        run: node tests/lesson4_comments_output.test.cjs
      - name: Godot debug messages and reliable line numbers
        run: node tests/error_guide.test.cjs
      - name: Code comprehension throughout the course
        run: node tests/code_guide.test.cjs
      - name: Backups and cloud sync
        run: node tests/auth_reliability.test.cjs
      - name: XP 2.0, weekly limits and quest claims
        run: node tests/progression_v2.test.cjs
      - name: Arena and official leaderboard schema invariants
        run: node tests/competition_schema.test.cjs
      - name: Godot Arena demo scoring and no fraudulent XP
        run: node tests/competition_arena.test.cjs
      - name: Private Arena coordinator tests
        run: node --test server/arena/tests/*.test.cjs
      - name: Official Arena client contracts
        run: node tests/arena_official.test.cjs
      - name: OCI local trust setup protections (offline, no OCI credentials)
        run: python3 -m unittest discover -s tests -p 'oci_trust_setup_test.py' -v
      - name: Oracle bridge OIDC claim validation (offline, no OCI credentials)
        run: python3 -m unittest discover -s tests -p 'oci_oidc_preflight_test.py' -v
      - name: Federated OCI audit authentication and read-only contracts (offline)
        run: python3 -m unittest discover -s tests -p 'oci_federated_readonly_test.py' -v
      - name: OCI local activation and list-only policy protections (offline)
        run: python3 -m unittest discover -s tests -p 'oci_trust_activation_test.py' -v
      - name: OCI staging host guards (offline)
        run: python3 -m unittest discover -s tests -p 'oci_provision_guards_test.py' -v
      - name: OCI SDK storage and launch contracts (offline, no network)
        run: |
          python3 -m pip install --disable-pip-version-check 'oci==2.189.0'
          python3 -m unittest discover -s tests -p 'oci_provision_sdk_test.py' -v

  arena-arm64:
    name: ARM64 Godot staging runtime (no OCI operations)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build actual ARM64 grader
        run: docker build -f server/arena/godot/Dockerfile.oci-arm64 -t gdh-godot-grader:4.4.1 server/arena/godot
      - name: Exercise actual isolated Godot process
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const {dockerCase} = require('./server/arena/runner.js');
          dockerCase('extends Node\nfunc double_value(x):\n    return x * 2\n', 'double_value', [4])
            .then(result => { assert.equal(result.status, 'executed'); assert.equal(result.value, 8); })
            .catch(error => { console.error('ARM64 grader smoke failed:', error.message); process.exitCode = 1; });
          JS
