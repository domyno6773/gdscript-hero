<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Godot Web spike - GDScript Hero</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1>Godot Web — GDScript Hero</h1><p><strong>Demo non isolata. Non inserire codice non fidato, accessi o dati personali.</strong></p>
<div id="status">Caricamento Godot…</div>

    print("A", "B")
